[project]
name = "agent-scaffold"
version = "0.1.0"
description = "A customizable general-purpose AI agent with Python tools and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn>=0.52.0,<1.0.0",
    "pydantic-ai>=2.21.0,<2.22.0",
    "pydantic-ai-harness>=0.14.0,<0.15.0",
    "fastmcp-slim[client,server]>=3.4.5,<4.0.0",
]

[project.scripts]
agent-scaffold = "agent_scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_scaffold"]

[dependency-groups]
dev = ["httpx>=0.28.1,<1.0.0", "ruff>=0.15.12"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
